<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/assets/os-192.png">
  <title>Oficina Simples · Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .adm { max-width: 1200px; margin: 0 auto; padding: 18px 16px 60px; }
    .adm-top { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
    .adm-tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 14px; }
    .adm-tabs button { white-space: nowrap; }
    .tbl-wrap { overflow-x: auto; }
    table.adm-t { width: 100%; border-collapse: collapse; font-size: 13.5px; }
    .adm-t th, .adm-t td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
    .adm-t th { color: var(--muted); font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
    .adm-t tr.clic { cursor: pointer; } .adm-t tr.clic:hover td { background: var(--card-2); }
    .kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
    pre.json { white-space: pre-wrap; word-break: break-all; font-size: 11.5px; background: var(--bg-2); padding: 10px; border-radius: 10px; max-height: 260px; overflow: auto; }
  </style>
</head>
<body>
  <div class="adm" id="adm"><div class="empty">Carregando...</div></div>
  <div id="modal-root"></div><div id="toast-root"></div>
  <script src="/js/config.js"></script>
  <script src="/js/vendor/supabase.js"></script>
  <script src="/js/util.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
