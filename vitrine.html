<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFFFFF">
  <title>Vitrine</title>
  <meta name="description" content="Celulares e acessórios disponíveis na loja.">
  <link rel="icon" href="/assets/os-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .wrap { max-width: 1100px; margin: 0 auto; padding: max(18px, env(safe-area-inset-top)) 16px calc(40px + var(--safe-b)); }
    .vt-head { text-align: center; margin: 6px 0 18px; }
    .vt-head h1 { margin: 0 0 4px; font-size: 26px; }
    .vt-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
    .vt-card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; }
    .vt-card.vendido { opacity: .5; }
    .vt-foto { aspect-ratio: 1; background: var(--bg-2) center/cover no-repeat; display: flex; align-items: center; justify-content: center; color: var(--muted); }
    .vt-body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
    .vt-body b { font-size: 14px; line-height: 1.3; }
    .vt-preco { font-size: 18px; font-weight: 800; color: var(--gold); }
    .vt-body .btn { margin-top: auto; }
    .vt-filtros { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 14px; }
    .vt-qtd { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-top: auto; }
    .vt-qtd b { min-width: 24px; text-align: center; }
    .vt-cart { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(14px + var(--safe-b)); z-index: 60; width: min(560px, calc(100vw - 24px));
      display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 16px; background: var(--gold-grad); color: var(--btn-texto); font-weight: 800; box-shadow: 0 12px 30px rgba(var(--sombra-rgb),.18); cursor: pointer; border: 0; font-size: 15px; }
    .wrap.com-cart { padding-bottom: 110px; }
  </style>
</head>
<body>
  <div class="wrap" id="vt"><div class="empty">Carregando...</div></div>
  <div id="modal-root"></div>
  <div id="toast-root"></div>
  <script src="/js/config.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/i18n-es.js"></script>
  <script src="/js/vendor/supabase.js"></script>
  <script src="/js/util.js"></script>
  <script src="/js/tema.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/vitrine.js"></script>
</body>
</html>
